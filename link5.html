<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>엠데아</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow-x:hidden;
    font-family:'Pretendard', sans-serif;

    background:
    radial-gradient(circle at top right, rgba(163,181,255,.35), transparent 30%),
    radial-gradient(circle at bottom left, rgba(206,191,255,.2), transparent 35%),
    #edf2fb;

    min-height:100vh;
    color:#38455a;
}

.bg-blur{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.glow{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    background:rgba(160,180,255,.18);
    filter:blur(90px);
}

.glow.one{
    top:-120px;
    right:-100px;
}

.glow.two{
    bottom:-150px;
    left:-100px;
}

.flame{
    position:absolute;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#d8e1ff;
    filter:blur(1px);
    box-shadow:
    0 0 20px #b8c6ff,
    0 0 45px #d7ddff;

    animation:float 6s ease-in-out infinite;
}

.flame::after{
    content:'';
    position:absolute;
    inset:5px;
    background:white;
    border-radius:50%;
    opacity:.9;
}

.flame:nth-child(1){
    top:12%;
    left:8%;
}

.flame:nth-child(2){
    top:25%;
    right:12%;
    animation-delay:2s;
}

.flame:nth-child(3){
    bottom:15%;
    left:18%;
    animation-delay:1s;
}

.flame:nth-child(4){
    bottom:12%;
    right:10%;
    animation-delay:3s;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-15px);
    }
    100%{
        transform:translateY(0px);
    }
}

nav{
    width:100%;
    padding:28px 60px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-family:'Gaegu', cursive;
    font-size:2rem;
    font-weight:700;
}

.menu{
    display:flex;
    gap:50px;
}

.menu a{
    text-decoration:none;
    color:#3f4960;
    font-weight:500;
    transition:.3s;
}

.menu a:hover{
    color:#7c8fff;
}

.wrapper{
    width:1300px;
    margin:20px auto 80px;

    background:
    linear-gradient(rgba(0,0,0,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 1px),
    rgba(255,255,255,.55);

    background-size:40px 40px;

    border-radius:35px;

    backdrop-filter:blur(12px);

    box-shadow:
    0 10px 40px rgba(130,140,190,.12);

    position:relative;

    padding:60px;

    overflow:hidden;
}

.tabs{
    display:flex;
    gap:14px;
    margin-bottom:50px;
}

.tab{
    padding:14px 32px;
    border-radius:15px;

    font-family:'Gaegu', cursive;
    font-size:1.3rem;

    background:#2f4477;
    color:white;

    box-shadow:
    0 0 18px rgba(120,150,255,.35);

    cursor:pointer;
}

.tab.inactive{
    background:#58423a;
    box-shadow:none;
}

.content{
    display:grid;
    grid-template-columns:500px 1fr;
    gap:70px;
}

.photos{
    position:relative;
    height:700px;
}

.polaroid{
    position:absolute;

    width:250px;

    background:white;

    padding:15px 15px 70px;

    border-radius:5px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.12);

    transition:.4s;
}

.polaroid:hover{
    transform:translateY(-10px) rotate(0deg);
}

.polaroid img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.polaroid.one{
    left:20px;
    top:0;
    transform:rotate(-5deg);
}

.polaroid.two{
    left:180px;
    top:220px;
    transform:rotate(6deg);
}

.name{
    margin-top:18px;

    font-family:'Gaegu', cursive;
    font-size:2rem;
}

/* tape */

.tape{
    width:90px;
    height:24px;

    background:rgba(210,220,255,.7);

    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);

    backdrop-filter:blur(3px);
}
.title{
    font-family:'Gaegu', cursive;
    font-size:4rem;
    margin-bottom:10px;
}

.tags{
    display:flex;
    gap:12px;
    flex-wrap:wrap;

    margin-bottom:40px;
}

.tag{
    background:#edf1ff;
    color:#6a79a7;

    padding:8px 14px;
    border-radius:12px;

    font-size:.9rem;
}

.character{
    margin-bottom:45px;
}

.character h2{
    font-family:'Gaegu', cursive;
    font-size:2.4rem;

    color:#5168a7;
}

.character p{
    margin-top:14px;
    line-height:1.8;
    color:#59657c;
}

.divider{
    width:100%;
    height:1px;

    background:
    linear-gradient(to right,
    transparent,
    rgba(110,120,180,.4),
    transparent);

    margin:35px 0;
}


.quote{
    margin-top:40px;

    width:360px;

    background:rgba(245,247,255,.7);

    padding:30px;

    border-radius:20px;

    backdrop-filter:blur(10px);

    box-shadow:
    0 10px 25px rgba(120,130,180,.08);
}

.quote p{
    line-height:2;
    color:#6b7291;
}

.timeline{
    margin-top:60px;

    background:rgba(255,255,255,.55);

    border-radius:25px;

    padding:35px;
}

.timeline-title{
    font-family:'Gaegu', cursive;
    font-size:2rem;

    margin-bottom:30px;
}

.line{
    width:100%;
    height:3px;

    background:#c8d2ff;

    position:relative;

    margin-bottom:40px;
}

.dot{
    width:18px;
    height:18px;

    border-radius:50%;

    background:#7388d9;

    position:absolute;
    top:50%;
    transform:translateY(-50%);
}

.dot:nth-child(1){ left:5%; }
.dot:nth-child(2){ left:35%; }
.dot:nth-child(3){ left:65%; }
.dot:nth-child(4){ left:92%; }

.events{
    display:flex;
    justify-content:space-between;
}

.event{
    text-align:center;
}

.event h4{
    margin-bottom:8px;
    color:#4e5872;
}

.side-scene{
    position:absolute;

    right:-40px;
    top:120px;

    width:350px;
    height:550px;

    background:
    linear-gradient(to top,
    rgba(35,45,90,.9),
    rgba(80,90,150,.3));

    border-radius:30px 0 0 30px;

    overflow:hidden;

    opacity:.88;
}

.side-scene::before{
    content:'';

    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at 50% 70%,
    rgba(180,200,255,.3),
    transparent 35%);
}

.moon{
    position:absolute;

    top:40px;
    right:50px;

    width:70px;
    height:70px;

    border-radius:50%;

    background:#eef3ff;

    box-shadow:
    0 0 30px rgba(255,255,255,.7);
}

@media(max-width:1400px){

    .wrapper{
        width:95%;
    }

}

@media(max-width:1100px){

    .content{
        grid-template-columns:1fr;
    }

    .photos{
        height:650px;
    }

    .side-scene{
        display:none;
    }

}

</style>
</head>

<body>

<div class="bg-blur">
    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="flame"></div>
    <div class="flame"></div>
    <div class="flame"></div>
    <div class="flame"></div>
</div>

<nav>

    <div class="logo">
        Made By Binil ✧
    </div>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Couple</a>
        <a href="#">Story</a>
        <a href="#">Note</a>
        <a href="#">About</a>
    </div>

</nav>

<section class="wrapper">

    <div class="tabs">
        <div class="tab">Main</div>
        <div class="tab inactive">IF</div>
    </div>

    <div class="content">

        <!-- left -->

        <div class="photos">

            <div class="polaroid one">

                <div class="tape"></div>

                <img src="image/mdea.jpg" />

                <div class="name">♡ M</div>

            </div>

            <div class="polaroid two">

                <div class="tape"></div>

                <img src="image/mdea.jpg" />

                <div class="name">♡ Idea</div>

            </div>

        </div>

        <div>

            <h1 class="title">엠데아</h1>

            <div class="tags">
                <div class="tag">#그것이</div>
                <div class="tag">#뭐냐</div>
                <div class="tag">#흠냐링</div>
                <div class="tag">#흠냐</div>
            </div>

            <div class="character">

                <h2>Morpheus Leggio</h2>

                <p>
                    "ㅇㅇㅇㅇㅇ"
                    <br><br>

                    ㅇㅇㅇㅇ
                    <br>

                    ㄹㄹㄹ
                </p>

            </div>

            <div class="divider"></div>

            <div class="character">

                <h2 style="color:#9878d8;">
                    Idea
                </h2>

                <p>
                    ssssss
                    <br><br>

                    ddd
                    <br>

                    test
                </p>

            </div>

            <div class="quote">
                <p>
                    수수수수퍼노바
                    <br><br>

                    ????
                </p>
            </div>

        </div>

    </div>

    <div class="timeline">

        <div class="timeline-title">
            Our Story ✦
        </div>

        <div class="line">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="events">

            <div class="event">
                <h4>D+0</h4>
                <p>1</p>
            </div>

            <div class="event">
                <h4>D+127</h4>
                <p>2</p>
            </div>

            <div class="event">
                <h4>D+316</h4>
                <p>3</p>
            </div>

            <div class="event">
                <h4>D+???</h4>
                <p>4</p>
            </div>

        </div>

    </div>

    <div class="side-scene">
        <div class="moon"></div>
    </div>

</section>

</body>
</html>
