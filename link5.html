<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>엠데아</title>
    <link rel="stylesheet" href="style.css">
    <style>
            body {
                background: linear-gradient(135deg, #e0eafc, #cfdef3);
                font-family: 'Pretendard', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            
            .notebook {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                padding: 40px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
                width: 800px;
            }
            
            .polaroid {
                background: white;
                padding: 10px;
                box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
                display: inline-block;
                transform: rotate(-5deg);
                margin: 10px;
            }
            
            .tags {
                color: #5a7d9a;
                font-size: 0.9em;
                margin-bottom: 20px;
            }
    </style>
</head>
<body>
    <div class="container">
        <div class="notebook">
            <div class="header">
                <button class="tab active">Main</button>
                <button class="tab">IF</button>
            </div>
            
            <div class="content">
                <div class="photos">
                    <div class="polaroid"><img src="mdea.jpg" alt="M"><span>♥ M</span></div>
                    <div class="polaroid"><img src="mdea.jpg" alt="Idea"><span>♥ Idea</span></div>
                </div>

                <div class="info">
                    <h1>엠데아</h1>
                    <div class="tags">#무언가 #있다 #그것이 #뭐냐 #나도모름</div>
                    <hr>
                    <h3>Morpheus Leggio</h3>
                    <p>"엠탈리안"</p>
                    <p>이탈리안장난아님</p>
                    
                    <h3>Idea</h3>
                    <p>"팔로미커밍백일루젼"</p>
                    <p>도도도도깨비불으악</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
